name: Playwright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-sign-in-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: playwright/microsoftteams/requirements.txt

      - name: Install Playwright dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r playwright/microsoftteams/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check Teams public sign-in page with Playwright
        run: python -m pytest playwright/microsoftteams/tests/test_public_sign_in_page.py -v
